<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vodacka navigácia</title>
    <meta
      name="keywords"
      content="navigacia, rieky, vodactvo, vodná turistika, Malý Dunaj, Mosonsky Dunaj" />
    <meta name="author" content="hurtis.sk" />
    <meta
      property="og:description"
      content="Aplikacia má pomôcť naplánovať vodácku trasu. Pomôže odhadnúť vzdialenosti a nájsť zaujímavé miesta na riekach." />
    <meta property="og:url" content="https://rieky.online" />
    <meta property="og:locale" content="sk_SK" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://rieky.online/rieka.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="490" />
    <meta property="og:image:height" content="327" />
    <link
      rel="icon"
      type="image/png"
      href="https://rieky.hurtis.sk/favicon.ico" />
    <link href="/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/leaflet.css?v2" />
    <link
      rel="stylesheet"
      href="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/leaflet.fullscreen.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />
    <link
      rel="stylesheet"
      href="/css/fontawesome.min.css"
      crossorigin="anonymous" />

    <link href="/css/style.css?v9" rel="stylesheet" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"><i class="fa-solid fa-anchor" aria-hidden="true"></i>Vodácka navigácia</a>
    </header>
    <main class="app-shell">
      <aside class="route-panel" aria-labelledby="planner-title">
        <div class="panel-content">
          <p class="eyebrow">VAŠA ĎALŠIA PLAVBA</p>
          <h1 id="planner-title">Naplánujte si splav</h1>
          <p class="panel-description">
            Vyberte rieku, nástupné miesto a cieľ.
          </p>
          <div class="field-group">
            <label for="river-select" class="form-label">Rieka</label>
            <select id="river-select" class="form-select">
              <option value="" disabled selected>Vyberte rieku</option>
              <option value="maly-dunaj">Malý Dunaj</option>
              <option value="mosonsky-dunaj">Mošonský Dunaj</option>
              <option value="dunaj">Dunaj (Bratislava)</option>
            </select>
          </div>
          <p id="river-status" class="status-text" role="status">
            Začnite výberom rieky.
          </p>
          <div id="start-end-selects" style="display: none">
            <div class="route-fields">
              <div class="field-group">
                <label for="start-select" class="form-label"
                  ><span class="route-dot"></span> Štart</label
                ><select id="start-select" class="form-select"></select>
              </div>
              <div class="field-group">
                <label for="end-select" class="form-label"
                  ><span class="route-dot destination"></span> Cieľ</label
                ><select id="end-select" class="form-select"></select>
              </div>
            </div>
            <div class="distance-card">
              <div>
                <p class="eyebrow">DĹŽKA TRASY</p>
                <div id="distance-info" role="status" aria-live="polite">
                  Vyberte body pre štart a cieľ.
                </div>
              </div>
              <button
                id="refresh-btn"
                type="button"
                class="refresh-button"
                title="Prepočítať trasu"
                aria-label="Prepočítať trasu">
                <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <div class="planner-hint">
            <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
            <p>
              Už ste pri vode? Ako štart môžete vybrať svoju aktuálnu polohu.
            </p>
          </div>
        </div>
        <footer class="panel-footer">
          <span>© 2026 rieky.hurtis.sk</span
          ><span>Dobrodružstvo začína pri vode.</span>
        </footer>
      </aside>
      <section class="map-area" aria-label="Mapa vodáckej trasy">
        <div id="map" class="map-holder"></div>
      </section>
    </main>
    <div
      class="modal fade"
      id="photoModal"
      tabindex="-1"
      aria-labelledby="modalTitle"
      aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle"></h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Zavrieť"></button>
          </div>
          <div class="modal-body text-center">
            <img
              id="modalImage"
              src=""
              alt="Fotka miesta"
              class="img-fluid rounded" />
            <p class="mt-3" id="modalText"></p>
          </div>
        </div>
      </div>
    </div>
    <script src="/js/jquery-3.6.4.min.js"></script>
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/leaflet.js?v2"></script>
    <script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/Leaflet.fullscreen.min.js"></script>
    <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.full.min.js"></script>
    <script src="/js/main.js?v13"></script>
  </body>
</html>
