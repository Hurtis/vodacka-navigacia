<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vodacka navigácia</title>
    <meta
      name="keywords"
      content="navigacia, rieky, vodactvo, vodná turistika, Malý Dunaj, Mosonsky Dunaj" />
    <meta name="author" content="hurtis.sk" />
    <meta
      property="og:description"
      content="Aplikacia má pomôcť naplánovať vodácku trasu. Pomôže odhadnúť vzdialenosti a nájsť zaujímavé miesta na riekach." />
    <meta property="og:url" content="https://rieky.online" />
    <meta property="og:locale" content="sk_SK" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://rieky.online/rieka.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="490" />
    <meta property="og:image:height" content="327" />
    <link
      rel="icon"
      type="image/png"
      href="https://rieky.hurtis.sk/favicon.ico" />
    <link href="/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/leaflet.css?v2" />
    <link
      rel="stylesheet"
      href="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/leaflet.fullscreen.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />
    <link
      rel="stylesheet"
      href="/css/fontawesome.min.css"
      crossorigin="anonymous" />

    <link href="/css/style.css?v2" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar sticky-top navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">Vodácka navigácia</a>
      </div>
    </nav>
    <div class="container mt-5">
      <div class="row justify-content-md-center">
        <div class="col-12 col-md-8">
          <div class="row">
            <div class="col-12">
              <div class="mb-3">
                <label for="river-select" class="form-label"
                  >Vyber rieky:</label
                >
                <select id="river-select" class="form-select">
                  <option value="" disabled selected>Vyberte rieku</option>

                  <option value="maly-dunaj">Malý Dunaj</option>
                  <option value="mosonsky-dunaj">Mošonský Dunaj</option>
                  <option value="dunaj">Dunaj (Bratislava)</option>
                </select>
              </div>
            </div>
          </div>
          <div id="start-end-selects" style="display: none">
            <div class="row">
              <div class="col-12 col-md-6">
                <div class="mb-3">
                  <label for="start-select" class="form-label">Štart:</label>
                  <select id="start-select" class="form-select"></select>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="mb-3">
                  <label for="end-select" class="form-label">Cieľ:</label>
                  <select id="end-select" class="form-select"></select>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-12">
                <div
                  class="p-3 border rounded-3 mb-3 bg-light d-flex justify-content-between align-items-center">
                  <div id="distance-info">Vyberte body pre štart a cieľ.</div>
                  <div>
                    <button
                      id="refresh-btn"
                      type="button"
                      class="btn btn-outline-secondary">
                      <i class="fa-solid fa-arrows-rotate"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row justify-content-md-center">
        <div class="col-12 col-md-8">
          <div id="map" class="map-holder"></div>
        </div>
      </div>
    </div>
    <div class="container">
      <div class="row justify-content-md-center">
        <div class="col-12 col-md-8">
          <footer class="py-3 my-4 border-top">
            <div class="text-center">
              <span class="mb-3 mb-md-0 text-body-secondary"
                >© 2026 rieky.hurtis.sk</span
              >
            </div>
          </footer>
        </div>
      </div>
    </div>
    <div
      class="modal fade"
      id="photoModal"
      tabindex="-1"
      aria-labelledby="photoModalLabel"
      aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle"></h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"></button>
          </div>
          <div class="modal-body text-center">
            <img
              id="modalImage"
              src=""
              alt="Fotka miesta"
              class="img-fluid rounded" />
            <p class="mt-3" id="modalText"></p>
          </div>
        </div>
      </div>
    </div>
    <script src="/js/jquery-3.6.4.min.js"></script>
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/leaflet.js?v2"></script>
    <script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/Leaflet.fullscreen.min.js"></script>
    <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.full.min.js"></script>
    <script src="/js/main.js?v5"></script>
  </body>
</html>
